<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Project Cleanroom - Secure Login</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      overflow: hidden;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* Animated Mesh Background */
    .mesh-bg { position: absolute; inset: 0; overflow: hidden; z-index: 0; background: #f8fafc; }
    .blob { position: absolute; filter: blur(90px); border-radius: 50%; animation: float 20s infinite ease-in-out alternate; opacity: 0.6; }
    .blob-1 { top: -10%; left: -10%; width: 600px; height: 600px; background: #c7d2fe; animation-delay: 0s; }
    .blob-2 { bottom: -20%; right: -10%; width: 700px; height: 700px; background: #bae6fd; animation-delay: -5s; }
    .blob-3 { top: 20%; left: 40%; width: 500px; height: 500px; background: #ddd6fe; animation-delay: -10s; }
    @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, 100px) scale(1.2); } }

    /* Glassmorphism Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
    }

    /* Premium Button Hover */
    .premium-btn { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
    .premium-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1); }
    .premium-btn:active { transform: translateY(0); box-shadow: 0 4px 10px -5px rgba(15, 23, 42, 0.1); }
  </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative">

  <!-- Mesh Gradient Background -->
  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Noise Overlay for texture -->
  <div class="absolute inset-0 z-0 opacity-[0.03]" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E'); pointer-events: none;"></div>

  <!-- Main Login UI Box -->
  <div class="relative z-10 w-full max-w-[420px] px-6">
    <div class="glass-card rounded-[2rem] p-10 text-center relative overflow-hidden group">
      
      <!-- Subtle top gradient accent -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-blue-500 to-purple-500 opacity-80"></div>

      <!-- Icon/Logo -->
      <div class="mx-auto w-16 h-16 rounded-2xl bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center mb-8 shadow-lg shadow-gray-900/20 transform transition duration-500 group-hover:scale-105">
        <span class="material-symbols-outlined text-white" style="font-size: 32px;">ballot</span>
      </div>

      <!-- Headers -->
      <h1 class="text-3xl font-black tracking-tight text-gray-900 mb-2">Project Cleanroom</h1>
      <p class="text-[15px] font-medium text-gray-500 mb-10 leading-relaxed">
        Central Intelligence Platform<br>Secure authentication required.
      </p>

      <!-- Google Sign In Button -->
      <a href="/login" class="premium-btn flex items-center justify-center gap-3 w-full bg-white border border-gray-200 hover:border-gray-300 text-gray-800 font-bold py-3.5 px-4 rounded-xl">
        <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          <path fill="none" d="M1 1h22v22H1z"/>
        </svg>
        <span class="tracking-wide">Continue with Google</span>
      </a>

      <!-- Footer text -->
      <div class="mt-8 pt-6 border-t border-gray-200/60">
        <p class="text-[11px] text-gray-400 font-bold tracking-widest uppercase flex items-center justify-center gap-1.5">
          <span class="material-symbols-outlined text-[14px]">lock</span>
          Authorized Personnel Only
        </p>
      </div>

    </div>
  </div>

</body>
</html>
